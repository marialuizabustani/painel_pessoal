name: Collect daily news

on:
  schedule:
    # GitHub Actions usa UTC: 09:00 UTC = 06:00 em Brasília (UTC-3).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Janela de publicação aceita (horas)"
        required: false
        default: "48"
      dry_run:
        description: "Coletar sem gravar no banco"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    name: Scrape feeds → Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml

      - name: Install collector
        run: pip install .

      - name: Run collector
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] && [ "$DRY_RUN" != "1" ]; then
            echo "::error::Secret SUPABASE_DB_URL não configurado (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          trend-collector
