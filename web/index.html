<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar de Tendências</title>
  <meta name="description" content="Manchetes diárias sobre trend forecasting, consumo, tecnologias emergentes, fashion tech, varejo e cultura — em português e inglês." />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #ffffff;
      --ink: #1b1a17;
      --muted: #6b665d;
      --line: #e3ddd2;
      --accent: #c2410c;
      --accent-soft: #fdebdf;
      --chip: #efe9df;
      --shadow: 0 1px 2px rgba(27, 26, 23, .06), 0 8px 24px rgba(27, 26, 23, .05);
      --radius: 14px;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #13120f; --surface: #1c1b18; --ink: #f1ede6; --muted: #a39d92;
        --line: #2e2c27; --accent: #fb923c; --accent-soft: #3a2416; --chip: #26241f;
        --shadow: none;
      }
    }
    :root[data-theme="dark"] {
      --bg: #13120f; --surface: #1c1b18; --ink: #f1ede6; --muted: #a39d92;
      --line: #2e2c27; --accent: #fb923c; --accent-soft: #3a2416; --chip: #26241f;
      --shadow: none;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font: 15px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

    /* Masthead */
    header.mast { border-bottom: 1px solid var(--line); padding: 28px 0 18px; }
    .mast-top { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; }
    h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(34px, 6vw, 60px);
      line-height: 1; margin: 14px 0 6px; letter-spacing: -.02em; }
    h1 span { color: var(--accent); }
    .tagline { color: var(--muted); margin: 0; max-width: 640px; }
    .theme-btn { background: none; border: 1px solid var(--line); color: var(--muted);
      border-radius: 999px; padding: 4px 10px; font: inherit; cursor: pointer; }

    /* Toolbar */
    .toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 0; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .row + .row { margin-top: 10px; }
    .seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
    .seg button, .chip { border: 0; background: none; color: var(--ink); font: 500 13px var(--sans);
      padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
    .seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
    .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { background: var(--chip); }
    .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .search { flex: 1 1 220px; min-width: 0; }
    .search input { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      border-radius: 999px; padding: 8px 14px; font: inherit; }
    .search input:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Content */
    main { padding: 22px 0 60px; }
    .status { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .notice { background: var(--accent-soft); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
    .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column; text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease; box-shadow: var(--shadow); }
    .card:hover { transform: translateY(-2px); }
    .card:hover h2 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .thumb { aspect-ratio: 16 / 9; background: var(--chip) center / cover no-repeat; }
    .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .lang { font-weight: 600; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
    .card h2 { font-family: var(--serif); font-weight: 500; font-size: 19px; line-height: 1.25; margin: 0; }
    .card p { margin: 0; color: var(--muted); font-size: 14px;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
    .tag { font-size: 11.5px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; }

    .card.lead { grid-column: 1 / -1; }
    @media (min-width: 760px) {
      .card.lead { flex-direction: row; }
      .card.lead .thumb { flex: 1.3; aspect-ratio: auto; min-height: 300px; }
      .card.lead .body { flex: 1; padding: 24px 26px; justify-content: center; }
      .card.lead h2 { font-size: 30px; font-weight: 700; }
      .card.lead p { -webkit-line-clamp: 5; font-size: 15px; }
    }

    .skeleton { height: 280px; border-radius: var(--radius); background: linear-gradient(90deg, var(--chip), var(--surface), var(--chip));
      background-size: 200% 100%; animation: shimmer 1.3s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .card { transition: none; } }
    .empty { text-align: center; color: var(--muted); padding: 60px 0; }
    .more { display: block; margin: 26px auto 0; }
    [hidden] { display: none !important; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; padding: 18px 0 30px; }
  </style>
</head>
<body>
  <header class="mast">
    <div class="wrap">
      <div class="mast-top">
        <span id="today"></span>
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Alternar tema">◐ Tema</button>
      </div>
      <h1>Radar de <span>Tendências</span></h1>
      <p class="tagline">Manchetes diárias sobre trend forecasting, consumo, tecnologias emergentes, fashion tech, inovação no varejo, coolhunting, foresight e cultura.</p>
    </div>
  </header>

  <nav class="toolbar" aria-label="Filtros">
    <div class="wrap">
      <div class="row">
        <div class="seg" role="group" aria-label="Período" id="period">
          <button type="button" data-days="1" aria-pressed="true">Hoje</button>
          <button type="button" data-days="7" aria-pressed="false">7 dias</button>
          <button type="button" data-days="30" aria-pressed="false">30 dias</button>
        </div>
        <div class="seg" role="group" aria-label="Idioma" id="lang">
          <button type="button" data-lang="" aria-pressed="true">Todos</button>
          <button type="button" data-lang="pt" aria-pressed="false">PT</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <label class="search"><input id="q" type="search" placeholder="Buscar manchetes…" aria-label="Buscar manchetes" /></label>
      </div>
      <div class="row">
        <div class="chips" id="topics" role="group" aria-label="Temas"></div>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <p class="status" id="status" aria-live="polite">Carregando…</p>
    <div id="notice"></div>
    <div class="grid" id="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
    <button class="chip more" id="more" type="button" hidden>Mostrar mais</button>
  </main>

  <footer>
    <div class="wrap">Atualizado diariamente às 6h (Brasília) via GitHub Actions · Dados: Supabase · Os links levam às matérias originais.</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
  (() => {
    "use strict";

    // Chave *publishable*: segura para o navegador. O acesso é limitado por RLS (somente leitura).
    const SUPABASE_URL = "https://uazqexuhlfpogzbptxhc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_AzW6GS58CFnwuckqw4C_qw_WZ_pmoBf";
    const PAGE_SIZE = 30;
    const FETCH_LIMIT = 500;

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false },
    });

    const $ = (id) => document.getElementById(id);
    const state = { days: 1, lang: "", topic: "", q: "", rows: [], shown: PAGE_SIZE, topics: new Map() };

    // ---------- Utilitários ----------
    const safeUrl = (u) => {
      try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; }
      catch { return null; }
    };
    const el = (tag, attrs = {}, ...children) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === "class") n.className = v; else n.setAttribute(k, v);
      }
      for (const c of children) if (c != null) n.append(c);
      return n;
    };
    const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const rtf = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
    const relTime = (iso) => {
      if (!iso) return "";
      const diff = (new Date(iso) - Date.now()) / 1000;
      const units = [["day", 86400], ["hour", 3600], ["minute", 60]];
      for (const [u, s] of units) if (Math.abs(diff) >= s || u === "minute") return rtf.format(Math.round(diff / s), u);
      return "";
    };
    const localISODate = (d) => {
      const off = d.getTimezoneOffset() * 60000;
      return new Date(d - off).toISOString().slice(0, 10);
    };
    const pref = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                   set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

    // ---------- Tema ----------
    const applyTheme = (t) => { if (t) document.documentElement.dataset.theme = t; };
    applyTheme(pref.get("theme"));
    $("themeBtn").addEventListener("click", () => {
      const cur = document.documentElement.dataset.theme ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      const next = cur === "dark" ? "light" : "dark";
      applyTheme(next); pref.set("theme", next);
    });

    $("today").textContent = new Date().toLocaleDateString("pt-BR",
      { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    // ---------- Dados ----------
    async function loadTopics() {
      const { data, error } = await db.from("topics").select("slug,name_pt,name_en").order("id");
      if (error) throw error;
      state.topics = new Map(data.map((t) => [t.slug, t]));
      const box = $("topics");
      box.replaceChildren(
        el("button", { type: "button", class: "chip", "data-topic": "", "aria-pressed": "true" }, "Todos os temas"),
        ...data.map((t) => el("button", { type: "button", class: "chip", "data-topic": t.slug, "aria-pressed": "false" }, t.name_pt))
      );
    }

    async function fetchArticles(days) {
      const since = new Date(); since.setDate(since.getDate() - (days - 1));
      const { data, error } = await db
        .from("articles_feed")
        .select("id,title,summary,url,image_url,language,published_at,collected_on,source_name,topics,relevance_score")
        .gte("collected_on", localISODate(since))
        .order("published_at", { ascending: false, nullsFirst: false })
        .limit(FETCH_LIMIT);
      if (error) throw error;
      return data || [];
    }

    async function load() {
      $("status").textContent = "Carregando…";
      $("notice").replaceChildren();
      try {
        let rows = await fetchArticles(state.days);
        if (!rows.length && state.days === 1) {
          // Antes da coleta das 6h, mostra os últimos 7 dias.
          rows = await fetchArticles(7);
          if (rows.length) $("notice").replaceChildren(el("div", { class: "notice" },
            "Ainda não há manchetes coletadas hoje — exibindo os últimos 7 dias."));
        }
        state.rows = rows;
        state.shown = PAGE_SIZE;
        render();
      } catch (err) {
        console.error(err);
        $("grid").replaceChildren();
        $("status").textContent = "Não foi possível carregar as manchetes. Tente novamente em instantes.";
      }
    }

    // ---------- Render ----------
    function filtered() {
      const q = norm(state.q);
      return state.rows.filter((r) =>
        (!state.lang || r.language === state.lang) &&
        (!state.topic || (r.topics || []).includes(state.topic)) &&
        (!q || norm(`${r.title} ${r.summary} ${r.source_name}`).includes(q)));
    }

    function card(r, lead) {
      const href = safeUrl(r.url);
      const img = safeUrl(r.image_url);
      const thumb = img ? el("div", { class: "thumb", role: "presentation" }) : null;
      if (thumb) thumb.style.backgroundImage = `url("${img.replace(/"/g, "%22")}")`;
      const tags = el("div", { class: "tags" },
        ...(r.topics || []).slice(0, 3).map((t) => el("span", { class: "tag" }, state.topics.get(t)?.name_pt || t)));
      return el("a", { class: lead ? "card lead" : "card", href, target: "_blank", rel: "noopener noreferrer" },
        thumb,
        el("div", { class: "body" },
          el("div", { class: "meta" },
            el("span", { class: "lang" }, (r.language || "").toUpperCase()),
            el("span", {}, r.source_name || ""),
            r.published_at ? el("time", { datetime: r.published_at }, "· " + relTime(r.published_at)) : null),
          el("h2", {}, r.title),
          r.summary ? el("p", {}, r.summary) : null,
          tags));
    }

    function render() {
      const rows = filtered();
      const grid = $("grid");
      if (!rows.length) {
        grid.replaceChildren(el("div", { class: "empty" }, "Nenhuma manchete encontrada para estes filtros."));
        $("status").textContent = "0 manchetes";
        $("more").hidden = true;
        return;
      }
      // Destaque: a matéria mais relevante com imagem entre as 10 mais recentes.
      const top = rows.slice(0, 10).filter((r) => r.image_url)
        .sort((a, b) => (b.relevance_score || 0) - (a.relevance_score || 0))[0];
      const ordered = top ? [top, ...rows.filter((r) => r !== top)] : rows;
      const page = ordered.slice(0, state.shown);
      grid.replaceChildren(...page.map((r, i) => card(r, i === 0 && !!top)));
      const pt = rows.filter((r) => r.language === "pt").length;
      const plural = (n) => `${n} ${n === 1 ? "manchete" : "manchetes"}`;
      $("status").textContent = `${plural(rows.length)} · ${pt} em português · ${rows.length - pt} em inglês`;
      $("more").hidden = state.shown >= ordered.length;
    }

    // ---------- Eventos ----------
    const segHandler = (groupId, key, attr, reload) => {
      $(groupId).addEventListener("click", (e) => {
        const b = e.target.closest("button"); if (!b) return;
        for (const x of $(groupId).querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
        state[key] = attr === "days" ? Number(b.dataset.days) : b.dataset[attr];
        state.shown = PAGE_SIZE;
        reload ? load() : render();
      });
    };
    segHandler("period", "days", "days", true);
    segHandler("lang", "lang", "lang", false);
    segHandler("topics", "topic", "topic", false);

    let t;
    $("q").addEventListener("input", (e) => {
      clearTimeout(t);
      t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE_SIZE; render(); }, 150);
    });
    $("more").addEventListener("click", () => { state.shown += PAGE_SIZE; render(); });

    loadTopics().catch(console.error).finally(load);
  })();
  </script>
</body>
</html>
