<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar de Tendências</title>
  <meta name="description" content="Manchetes do dia sobre consumo, tecnologia, moda, varejo e cultura, em português e inglês." />
  <meta name="color-scheme" content="light dark" />
  <!-- Design system Marginália: tokens gerados de tokens.json + bundle.css (classes mg-*). -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/bundle.css" />
  <style>
    .wrap { max-width: var(--container); margin: 0 auto; padding: 0 var(--space-6); }

    /* Cabeçalho */
    .masthead { padding: var(--space-7) 0 var(--space-6); border-bottom: var(--hairline) solid var(--line); }
    .mast-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
    .masthead h1 { margin: var(--space-5) 0 var(--space-4); font-size: clamp(40px, 6vw, 56px); }
    .masthead h1 em { font-style: italic; color: var(--accent); }
    .masthead .lead { margin: 0; max-width: var(--measure); color: var(--ink-secondary); }

    /* Filtros */
    .toolbar { padding: var(--space-5) 0; border-bottom: var(--hairline) solid var(--line); display: flex; flex-direction: column; gap: var(--space-5); }
    .toolbar-row { display: flex; flex-wrap: wrap; gap: var(--space-5); align-items: flex-end; }
    .search { flex: 1 1 240px; min-width: 0; }
    .search .mg-input { width: 100%; }
    .topics { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-1); }
    @media (min-width: 900px) { .topics { flex-wrap: wrap; overflow: visible; } }
    .topic { flex: none; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; min-height: var(--control-md);
      padding: 0 var(--space-3); border: var(--hairline) solid var(--control-border); border-radius: var(--radius-sm);
      background: var(--surface-raised); color: var(--ink); cursor: pointer; }
    .topic:hover { background: var(--surface-sunken); }
    .topic[aria-pressed="true"] { background: var(--surface-inverse); color: var(--ink-inverse); border-color: var(--surface-inverse); }

    /* Conteúdo */
    main { padding: var(--space-6) 0 var(--space-8); }
    .status { margin: 0 0 var(--space-5); color: var(--ink-muted); }
    .notice { margin: 0 0 var(--space-5); padding: var(--space-4); background: var(--surface-sunken);
      border: var(--hairline) solid var(--line); color: var(--ink-secondary); }
    .list { border-top: var(--hairline) solid var(--line-strong); padding-top: var(--space-5); }
    .grid { display: grid; gap: var(--space-5); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

    .card { display: flex; flex-direction: column; background: var(--surface-raised); border: var(--hairline) solid var(--line);
      color: var(--ink); text-decoration: none; }
    .card:hover .card-title { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .card-img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--surface-sunken);
      border-bottom: var(--hairline) solid var(--line); }
    .card-body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); flex: 1; }
    .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
    .card-title { margin: 0; }
    .card-sum { margin: 0; color: var(--ink-secondary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-tags { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: auto; padding-top: var(--space-2); }

    .card.lead { grid-column: 1 / -1; }
    .card.lead .card-title { font-size: clamp(28px, 4vw, 44px); line-height: 1.1; font-weight: 400; letter-spacing: -0.02em; }
    .card.lead .card-sum { -webkit-line-clamp: 5; }
    @media (min-width: 760px) {
      .card.lead { flex-direction: row; }
      .card.lead .card-img { flex: 1.2 1 0; min-width: 0; height: auto; aspect-ratio: auto; min-height: 320px; align-self: stretch;
        border-bottom: 0; border-right: var(--hairline) solid var(--line); }
      .card.lead .card-body { flex: 1 1 0; min-width: 0; padding: var(--space-6); justify-content: center; }
      .card.lead .card-title { font-size: clamp(28px, 3vw, 40px); }
    }

    .skeleton { min-height: 260px; background: var(--surface-sunken); border: var(--hairline) solid var(--line); animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } }

    .empty { grid-column: 1 / -1; padding: var(--space-8) 0; text-align: center; color: var(--ink-secondary); display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
    .empty p { margin: 0; }
    .more-wrap { display: flex; justify-content: center; margin-top: var(--space-7); }
    [hidden] { display: none !important; }

    footer { border-top: var(--hairline) solid var(--line); padding: var(--space-6) 0; color: var(--ink-muted); }
    footer p { margin: 0; max-width: var(--measure); }
    @media (max-width: 480px) { .wrap { padding: 0 var(--space-4); } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <div class="mast-top">
        <p class="mg-kicker" id="today"></p>
        <button class="mg-btn mg-btn-quiet" id="themeBtn" type="button">Usar tema Tinta</button>
      </div>
      <h1 class="mg-t-display-l">Radar de <em>tendências.</em></h1>
      <p class="lead mg-t-body-l">Manchetes do dia sobre consumo, tecnologia, moda, varejo e cultura, em português e inglês.</p>
    </div>
  </header>

  <div class="wrap">
    <section class="toolbar" aria-label="Filtros">
      <div class="toolbar-row">
        <div class="mg-field">
          <span class="mg-label" id="lbl-period">Período</span>
          <div class="mg-seg" role="group" aria-labelledby="lbl-period" id="period">
            <button type="button" data-days="1" aria-pressed="true">Hoje</button>
            <button type="button" data-days="7" aria-pressed="false">7 dias</button>
            <button type="button" data-days="30" aria-pressed="false">30 dias</button>
          </div>
        </div>
        <div class="mg-field">
          <span class="mg-label" id="lbl-lang">Idioma</span>
          <div class="mg-seg" role="group" aria-labelledby="lbl-lang" id="lang">
            <button type="button" data-lang="" aria-pressed="true">Todos</button>
            <button type="button" data-lang="pt" aria-pressed="false">Português</button>
            <button type="button" data-lang="en" aria-pressed="false">Inglês</button>
          </div>
        </div>
        <div class="mg-field search">
          <label class="mg-label" for="q">Buscar</label>
          <input class="mg-input" id="q" type="search" placeholder="Ex.: varejo, moda circular" autocomplete="off" />
        </div>
      </div>
      <div class="mg-field">
        <span class="mg-label" id="lbl-topic">Tema</span>
        <div class="topics" id="topics" role="group" aria-labelledby="lbl-topic"></div>
      </div>
    </section>

    <main>
      <p class="status mg-t-caption" id="status" aria-live="polite">Carregando manchetes…</p>
      <div id="notice"></div>
      <div class="list">
        <div class="grid" id="grid">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
      </div>
      <div class="more-wrap"><button class="mg-btn mg-btn-secondary" id="more" type="button" hidden>Mostrar mais</button></div>
    </main>
  </div>

  <footer>
    <div class="wrap">
      <p class="mg-t-caption">Atualizado todos os dias às 6h, horário de Brasília. Os links levam às matérias originais.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
  (() => {
    "use strict";

    // Chave *publishable*: segura no navegador. O acesso é limitado por RLS (somente leitura).
    const SUPABASE_URL = "https://uazqexuhlfpogzbptxhc.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_AzW6GS58CFnwuckqw4C_qw_WZ_pmoBf";
    const PAGE_SIZE = 30;
    const FETCH_LIMIT = 500;

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false },
    });

    const $ = (id) => document.getElementById(id);
    const state = { days: 1, lang: "", topic: "", q: "", rows: [], shown: PAGE_SIZE, topics: new Map() };

    // ---------- Utilitários ----------
    const safeUrl = (u) => {
      try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:" ? x.href : null; }
      catch { return null; }
    };
    const el = (tag, attrs = {}, ...children) => {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k === "class") n.className = v; else n.setAttribute(k, v);
      }
      for (const c of children) if (c != null) n.append(c);
      return n;
    };
    const norm = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const rtf = new Intl.RelativeTimeFormat("pt-BR", { numeric: "auto" });
    const relTime = (iso) => {
      if (!iso) return "";
      const diff = (new Date(iso) - Date.now()) / 1000;
      for (const [u, s] of [["day", 86400], ["hour", 3600], ["minute", 60]]) {
        if (Math.abs(diff) >= s || u === "minute") return rtf.format(Math.round(diff / s), u);
      }
      return "";
    };
    const localISODate = (d) => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    const pref = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* sem armazenamento */ } },
    };
    const plural = (n) => `${n} ${n === 1 ? "manchete" : "manchetes"}`;

    // ---------- Tema (Papel / Tinta) ----------
    const currentTheme = () => document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const paintThemeBtn = () => { $("themeBtn").textContent = currentTheme() === "dark" ? "Usar tema Papel" : "Usar tema Tinta"; };
    const saved = pref.get("theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
    paintThemeBtn();
    $("themeBtn").addEventListener("click", () => {
      const next = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      pref.set("theme", next);
      paintThemeBtn();
    });

    $("today").textContent = new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });

    // ---------- Dados ----------
    async function loadTopics() {
      const { data, error } = await db.from("topics").select("slug,name_pt,name_en").order("id");
      if (error) throw error;
      state.topics = new Map(data.map((t) => [t.slug, t]));
      $("topics").replaceChildren(
        el("button", { type: "button", class: "topic", "data-topic": "", "aria-pressed": "true" }, "Todos"),
        ...data.map((t) => el("button", { type: "button", class: "topic", "data-topic": t.slug, "aria-pressed": "false" }, t.name_pt))
      );
    }

    async function fetchArticles(days) {
      const since = new Date(); since.setDate(since.getDate() - (days - 1));
      const { data, error } = await db
        .from("articles_feed")
        .select("id,title,summary,url,image_url,language,published_at,collected_on,source_name,topics,relevance_score")
        .gte("collected_on", localISODate(since))
        .order("published_at", { ascending: false, nullsFirst: false })
        .limit(FETCH_LIMIT);
      if (error) throw error;
      return data || [];
    }

    async function load() {
      $("status").textContent = "Carregando manchetes…";
      $("notice").replaceChildren();
      $("more").hidden = true;
      try {
        let rows = await fetchArticles(state.days);
        if (!rows.length && state.days === 1) {
          rows = await fetchArticles(7); // antes da coleta das 6h
          if (rows.length) $("notice").replaceChildren(el("p", { class: "notice" },
            "Ainda não há manchetes coletadas hoje. Exibindo os últimos 7 dias."));
        }
        state.rows = rows;
        state.shown = PAGE_SIZE;
        render();
      } catch (err) {
        console.error(err);
        $("status").textContent = "";
        const retry = el("button", { type: "button", class: "mg-btn mg-btn-secondary" }, "Tentar de novo");
        retry.addEventListener("click", load);
        $("grid").replaceChildren(el("div", { class: "empty" },
          el("p", { class: "mg-t-heading-s" }, "Não foi possível carregar as manchetes."), retry));
      }
    }

    // ---------- Render ----------
    function filtered() {
      const q = norm(state.q);
      return state.rows.filter((r) =>
        (!state.lang || r.language === state.lang) &&
        (!state.topic || (r.topics || []).includes(state.topic)) &&
        (!q || norm(`${r.title} ${r.summary} ${r.source_name}`).includes(q)));
    }

    function card(r, lead) {
      const img = safeUrl(r.image_url);
      let thumb = null;
      if (img) {
        thumb = el("img", { class: "card-img", src: img, alt: "", loading: "lazy", referrerpolicy: "no-referrer" });
        thumb.addEventListener("error", () => thumb.remove());
      }
      const kicker = [r.source_name, (r.language || "").toUpperCase(), r.published_at ? relTime(r.published_at) : ""]
        .filter(Boolean).join(" · ");
      return el("a", { class: lead ? "card lead" : "card", href: safeUrl(r.url), target: "_blank", rel: "noopener noreferrer" },
        thumb,
        el("div", { class: "card-body" },
          el("div", { class: "card-head" },
            el("p", { class: "mg-kicker" }, kicker),
            lead ? el("span", { class: "mg-badge" }, "Destaque") : null),
          el("h2", { class: "card-title mg-t-heading-s" }, r.title),
          r.summary ? el("p", { class: "card-sum mg-t-body-s" }, r.summary) : null,
          el("div", { class: "card-tags" },
            ...(r.topics || []).slice(0, 3).map((t) => el("span", { class: "mg-tag" }, state.topics.get(t)?.name_pt || t)))));
    }

    function render() {
      const rows = filtered();
      const grid = $("grid");
      if (!rows.length) {
        const clear = el("button", { type: "button", class: "mg-btn mg-btn-secondary" }, "Limpar filtros");
        clear.addEventListener("click", resetFilters);
        grid.replaceChildren(el("div", { class: "empty" },
          el("p", { class: "mg-t-heading-s" }, "Nenhuma manchete para estes filtros."), clear));
        $("status").textContent = plural(0);
        $("more").hidden = true;
        return;
      }
      // Destaque: a mais relevante, com imagem, entre as 10 mais recentes.
      const top = rows.slice(0, 10).filter((r) => r.image_url)
        .sort((a, b) => (b.relevance_score || 0) - (a.relevance_score || 0))[0];
      const ordered = top ? [top, ...rows.filter((r) => r !== top)] : rows;
      grid.replaceChildren(...ordered.slice(0, state.shown).map((r, i) => card(r, i === 0 && !!top)));
      const pt = rows.filter((r) => r.language === "pt").length;
      $("status").textContent = `${plural(rows.length)} · ${pt} em português · ${rows.length - pt} em inglês`;
      $("more").hidden = state.shown >= ordered.length;
    }

    // ---------- Eventos ----------
    function press(groupId, btn) {
      for (const x of $(groupId).querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === btn));
    }
    function resetFilters() {
      Object.assign(state, { lang: "", topic: "", q: "", shown: PAGE_SIZE });
      $("q").value = "";
      press("lang", $("lang").querySelector("button"));
      press("topics", $("topics").querySelector("button"));
      render();
    }
    $("period").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      press("period", b); state.days = Number(b.dataset.days); load();
    });
    $("lang").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      press("lang", b); state.lang = b.dataset.lang; state.shown = PAGE_SIZE; render();
    });
    $("topics").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      press("topics", b); state.topic = b.dataset.topic; state.shown = PAGE_SIZE; render();
    });
    let timer;
    $("q").addEventListener("input", (e) => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.q = e.target.value; state.shown = PAGE_SIZE; render(); }, 150);
    });
    $("more").addEventListener("click", () => { state.shown += PAGE_SIZE; render(); });

    loadTopics().catch(console.error).finally(load);
  })();
  </script>
</body>
</html>
